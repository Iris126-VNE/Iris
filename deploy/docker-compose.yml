services:
  hub-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8765
      API_KEYS: ${API_KEYS:-dev-secret-key:default-tenant}
      HEARTBEAT_TIMEOUT_MS: 45000
      CALL_TIMEOUT_MS: 25000
    ports:
      - "8765:8765"

